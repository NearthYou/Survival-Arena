name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch pinned vcpkg
        shell: bash
        run: |
          git init .vcpkg
          git -C .vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C .vcpkg fetch --depth 1 origin 127402f1c75bb3d5ff6bce04b285faa4930a5aca
          git -C .vcpkg checkout --detach FETCH_HEAD

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B out/build/ci -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DDXA_BUILD_TESTS=ON
          -DDXA_WARNINGS_AS_ERRORS=ON

      - name: Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          cmake -S . -B out/build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DDXA_BUILD_TESTS=ON
          -DDXA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build out/build/ci --config Debug

      - name: Test
        run: ctest --test-dir out/build/ci --build-config Debug --output-on-failure

      - name: Verify Windows WARP smoke registration
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir out/build/ci --build-config Debug --output-on-failure
          --no-tests=error -R '^Client\.WarpSmoke$'

      - name: Verify Windows shader deployment registration
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir out/build/ci --build-config Debug --output-on-failure
          --no-tests=error -R '^Client\.ShaderDeployment$'

      - name: Verify Windows asset shader registration
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir out/build/ci --build-config Debug --output-on-failure
          --no-tests=error -R '^Client\.AssetShaderDeployment$'

      - name: Verify Windows character asset registration
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir out/build/ci --build-config Debug --output-on-failure
          --no-tests=error -R '^Client\.CharacterAssetDeployment$'

      - name: Verify Windows floor asset registration
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir out/build/ci --build-config Debug --output-on-failure
          --no-tests=error -R '^Client\.FloorAssetDeployment$'

      - name: Verify Windows texture asset registration
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir out/build/ci --build-config Debug --output-on-failure
          --no-tests=error -R '^Client\.TextureAssetDeployment$'
